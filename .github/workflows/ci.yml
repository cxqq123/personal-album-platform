name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  # ------------------------------------------------------------------- 共享逻辑
  shared:
    name: Shared logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      # 三端共用的业务规则：JVM / iOS(kotlin.native) / JS 一起测
      - name: Test shared module
        run: ./gradlew :shared:allTests

      - name: Build JS artifact for web
        run: ./gradlew :shared:jsProductionLibraryDistribution

      - uses: actions/upload-artifact@v4
        with:
          name: shared-js
          path: shared/build/dist/js/productionLibrary/
          retention-days: 3

  # ----------------------------------------------------------------------- Web
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    needs: [shared]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: gradle/actions/setup-gradle@v4

      # web 通过 file: 依赖引用 shared 的 JS 产物，所以先构建
      - name: Build shared JS
        run: ./gradlew :shared:jsProductionLibraryDistribution

      - name: Install
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Test
        working-directory: web
        run: npm run test

      - name: Build
        working-directory: web
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

  # ------------------------------------------------------------------- Android
  android:
    name: Android
    runs-on: ubuntu-latest
    needs: [shared]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Check
        run: ./gradlew check

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug

      - name: Build release AAB (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.jks
          ./gradlew :composeApp:bundleRelease \
            -Pandroid.injected.signing.store.file=/tmp/release.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: app-bundle
          path: composeApp/build/outputs/bundle/release/*.aab

  # ----------------------------------------------------------------------- iOS
  ios:
    name: iOS compile
    runs-on: macos-15
    needs: [shared]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Kotlin/Native 侧编译（Linux 上无法执行）
      - name: Compile Kotlin for iOS
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64

      # Xcode 壳工程构建（不签名）
      - name: Build iOS app (no signing)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  # ---------------------------------------------------------------------- 发布
  # 打 tag 时触发；提审与线上部署仍然由人手动做。
  release-android:
    name: Release → Play internal
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: gradle/actions/setup-gradle@v4
      - run: bundle exec fastlane android beta
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  release-ios:
    name: Release → TestFlight
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ios]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: bundle exec fastlane ios beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_SSH_KEY: ${{ secrets.MATCH_SSH_KEY }}
